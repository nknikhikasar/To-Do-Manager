name: 🚀 Development - Build, Test, Deploy

on:
  push:
    branches: [development]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Set environment (development)
        run: echo "APP_ENV=development" >> $GITHUB_ENV

      - name: Run Cypress Tests
        uses: cypress-io/github-action@v6
        with:
          start: npm run dev
          wait-on: 'http://localhost:5173'
          browser: chrome
          config: video=false

      - name: Build Vue App
        run: npm run build

      - name: Upload dist folder
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Deploy to GitHub Pages → /dev
        uses: peaceiris/actions-gh-pages@v4
        with:
          publish_dir: dist
          destination_dir: dev
          keep_files: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
